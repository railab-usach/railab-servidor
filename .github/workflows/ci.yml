# Revisión automática en cada push y pull request (gratis en repos públicos).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Revisa los scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning herramientas/*.sh

  enlaces:
    name: Revisa los enlaces de la documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress '**/*.md'
          fail: true

  secretos:
    name: Busca claves filtradas (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Revisión automática en cada push y pull request (gratis en repos públicos).
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: Revisa los scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning herramientas/*.sh

  enlaces:
    name: Revisa los enlaces de la documentación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress '**/*.md'
          fail: true

  secretos:
    name: Busca claves filtradas (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # La action oficial pide licencia en organizaciones; el programa (MIT) no.
      - name: Revisa todo el historial con gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$VERSION
          curl -sSfLO "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
